# SPDX-License-Identifier: MIT
# Builds the ME-less capsule build and pushes it to Cachix. On main it also signs a capsule and
# publishes it with the fwupd metadata as a GitHub Release. Never build the full image here: it
# holds the ME, which must not reach the cache or a release.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: bootleg
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: nix build -L .#optiplex-3050-capsule

      - name: Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          CAPSULE_SIGNER: ${{ secrets.CAPSULE_SIGNER }}
          GH_TOKEN: ${{ github.token }}
        run: |
          nix shell --inputs-from . nixpkgs#libjcat nixpkgs#gcab nixpkgs#zstd nixpkgs#python3 \
            nixpkgs#openssl nixpkgs#jq -c .github/release.sh optiplex-3050
          v=$(<dist/version)
          gh release create "$v" --target "$GITHUB_SHA" --title "bootleg $v" \
            --notes "Built from $GITHUB_SHA." \
            dist/*.cap dist/*.cab dist/firmware.xml.zst dist/firmware.xml.zst.jcat
