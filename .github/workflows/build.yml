# SPDX-License-Identifier: MIT
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Pinned to commits: this job holds the capsule signing key.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31
      - uses: cachix/cachix-action@3ba601ff5bbb07c7220846facfa2cd81eeee15a1 # v16
        with:
          name: bootleg
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: nix build -L .#optiplex-3050-capsule

      - name: Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          CAPSULE_SIGNER: ${{ secrets.CAPSULE_SIGNER }}
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(<result/capsule-version)
          # "Latest" is the newest release by date, so a re-run of an older commit would win.
          latest=$(gh release view --json tagName -q .tagName 2>/dev/null || echo 0)
          if [ "$v" -le "$latest" ]; then
            echo "::notice::$v is not newer than the latest release $latest, not publishing"
            exit 0
          fi
          nix shell --inputs-from . nixpkgs#libjcat nixpkgs#gcab nixpkgs#zstd nixpkgs#python3 \
            nixpkgs#openssl nixpkgs#jq nixpkgs#gnutar nixpkgs#xz -c .github/release.sh optiplex-3050
          gh release create "$v" --target "$GITHUB_SHA" --title "bootleg $v" \
            --notes "Built from $GITHUB_SHA." \
            dist/*.cap dist/*.cab dist/firmware.xml.zst dist/firmware.xml.zst.jcat \
            dist/*-source.tar.xz
