# SPDX-License-Identifier: MIT
name: update-lock

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31
      - run: |
          cp flake.lock /tmp/old.lock
          nix flake update
          .github/lock-changes.sh /tmp/old.lock flake.lock > /tmp/body.md
      - id: pr
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          branch: update-lock
          commit-message: "flake.lock: Update"
          title: "flake.lock: Update"
          body-path: /tmp/body.md
      - if: steps.pr.outputs.pull-request-head-sha
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build.yml --ref update-lock
