# SPDX-License-Identifier: MIT
# Weekly flake.lock update. Builds first and opens a pull request only if the build passes; a
# failed run means a patch no longer applies or the build broke upstream.
name: update-lock

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: bootleg
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: nix flake update
      - run: nix build -L .#optiplex-3050-capsule
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: update-lock
          commit-message: "flake.lock: Update"
          title: "flake.lock: Update"
          body: The capsule builds with the new inputs. Drop patches upstream now contains before merging.
